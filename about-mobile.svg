  <text x="28" y="36" font-size="11" fill="#63b3ff" font-weight="600" letter-spacing="2">01 / ABOUT ME</text><path d="M28 54L452 54" stroke="#243345"/><text x="28" y="93" font-size="21" fill="#f0f5fc" font-weight="600" >From interface to implementation.</text><text x="28" y="132" font-size="17" fill="#a8b7c9" font-weight="400" >I&#x27;m a Computer Science engineering student</text><text x="28" y="159" font-size="17" fill="#a8b7c9" font-weight="400" >in Chennai, building web applications with</text><text x="28" y="186" font-size="17" fill="#a8b7c9" font-weight="400" >React, Java / Spring Boot and Node.js.</text><text x="28" y="213" font-size="17" fill="#a8b7c9" font-weight="400" >I also work with Python and computer vision.</text><path d="M28 239L452 239" stroke="#243345"/><text x="28" y="270" font-size="11" fill="#63b3ff" font-weight="600" letter-spacing="2">EDUCATION</text><text x="28" y="301" font-size="20" fill="#f0f5fc" font-weight="600" >B.E. Computer Science</text><text x="28" y="330" font-size="16" fill="#a8b7c9" font-weight="400" >St. Joseph&#x27;s Institute of Technology</text><text x="28" y="378" font-size="11" fill="#63b3ff" font-weight="600" letter-spacing="2">EXPERIENCE</text><text x="28" y="408" font-size="20" fill="#f0f5fc" font-weight="600" >Front End Developer Intern</text><text x="28" y="437" font-size="16" fill="#a8b7c9" font-weight="400" >GEM3S Technologies | Jun - Jul 2025</text><path d="M28 463L452 463" stroke="#243345"/><text x="28" y="495" font-size="16" fill="#63b3ff" font-weight="400" >Full stack development + applied ML</text><g transform="translate(103 520) scale(.9)"><g class="settle"><g class="sway"><path d="M138 0H166L163 107H141Z" fill="url(#strap)"/><text x="157" y="14" font-size="9" fill="#f0f5fc" font-weight="600" writing-mode="tb" letter-spacing="2">HUSSAIN-188</text><rect x="135" y="105" width="34" height="21" rx="5" fill="#8296ac"/><rect x="145" y="111" width="14" height="5" rx="2" fill="#34465c"/><circle cx="152" cy="137" r="10