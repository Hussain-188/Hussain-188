name: Update contribution artwork

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main, master]
    paths:
      - README.md
      - .github/workflows/snake.yml
      - scripts/build_activity.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Hussain-188/Hussain-188'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile sources
        uses: actions/checkout@v4

      - name: Generate contribution activity graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_activity.py --username Hussain-188 --output-dir dist

      - name: Generate Hussain's contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hussain-188
          outputs: |
            dist/snake.svg?color_snake=#63b3ff
            dist/snake-dark.svg?palette=github-dark&color_snake=#63b3ff

      - name: Publish generated artwork
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: Update Hussain's contribution artwork
